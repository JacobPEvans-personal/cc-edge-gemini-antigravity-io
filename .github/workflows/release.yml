name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[RT]C[0-9]+'

permissions:
  contents: write

jobs:
  release:
    if: github.event.repository.is_template == false
    uses: dryvist/cc-edge-pack-template/.github/workflows/cribl-pack-release.yml@bc101e35c1502be7e537b0cdb79f9a9f7d2c9555 # main
